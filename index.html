<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>現場図面共有</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@800&display=swap">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:'Noto Sans JP','Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif;font-weight:800;background:#555}
body{display:flex;flex-direction:column;overscroll-behavior:none}
#bar{background:#fff;padding:6px;padding-top:max(6px,env(safe-area-inset-top));display:flex;flex-wrap:wrap;gap:5px;align-items:center;border-bottom:1px solid #ccc;font-size:13px}
#bar button,#bar select,#bar label.b{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:15px;padding:4px 11px;border:3px solid #777;border-radius:10px;background:#dce9f8;color:#111;cursor:pointer}
#bar select{padding:6px 8px}
#bar button.on{background:#9cc4f5;border-color:#1d6fd8}
#bar svg{width:24px;height:24px;flex:none}
#bar .sep{width:1px;height:24px;background:#ccc}
#st{color:#444;font-size:13px}
#wrap{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;background:#777}
</style></head><body>
<div id="bar">
 <select id="nm"></select><button id="reg">＋登録</button>
 <button id="mk">部屋作成</button><button id="jn">参加</button><button id="cp">リンクコピー</button>
 <span class="sep"></span>
 <label class="b">図面読込<input id="file" type="file" accept="image/*,.pdf,.dxf" hidden></label>
 <span class="sep"></span>
 <button data-t="ptr" class="on"><svg viewBox="0 0 24 24"><path d="M4 3L21 12L11 14L8 21Z" fill="#e8574c" stroke="#e8574c" stroke-width="2" stroke-linejoin="round"/></svg>矢印</button>
 <button data-t="las"><svg viewBox="0 0 24 24"><path d="M18 8A8 8 0 1 0 15 20" fill="none" stroke="#e00" stroke-width="2.6" stroke-linecap="round"/><circle cx="19" cy="6" r="3" fill="#f58aa5"/></svg>レーザーポインター</button>
 <button data-t="pen"><svg viewBox="0 0 24 24"><path d="M4 21L5.5 15L16 4.5L20 8.5L9.5 19Z" fill="#2a6fb5" stroke="#1b3d63" stroke-width="1.5" stroke-linejoin="round"/><path d="M4 21L5.5 15L9.5 19Z" fill="#333"/></svg>ペン</button>
 <button data-t="sel"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="#3a9d2f" stroke-width="2.6" stroke-dasharray="4 3"/></svg>選択</button>
 <button data-t="pan"><svg viewBox="0 0 24 24"><path d="M12 1.5L16.5 7H13.5V10.5H17V7.5L22.5 12L17 16.5V13.5H13.5V17H16.5L12 22.5L7.5 17H10.5V13.5H7V16.5L1.5 12L7 7.5V10.5H10.5V7H7.5Z" fill="#f00"/></svg>移動</button>
 <button id="del">選択を削除</button><button id="fit">全体</button>
 <span id="st">未接続(ひとりで使用中)</span>
 <span style="color:#888;font-size:11px">ver 1112-h</span>
</div>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
const $=id=>document.getElementById(id),cv=$('cv'),cx=cv.getContext('2d'),dpr=window.devicePixelRatio||1;
const COL=['#e63946','#1d6fd8','#2a9d3f','#e08a00','#8e44ad','#00897b','#d81b60','#6d4c41'];
let img=null,baseData=null,W=1000,H=700,V={s:1,x:0,y:0},tool='ptr',strokes={},lasers=[],ptrs={},sel=null,cur=null;
let pdfBytes=null,pdfNo=1,pdfPage=null,hi=null,Vh=null,rtask=null,ht=0,vk='';
let users=JSON.parse(localStorage.gsUsers||'[]');
const me={id:Math.random().toString(36).slice(2,8),name:localStorage.gsName||'',c:COL[Math.floor(Math.random()*COL.length)]};
function fillNames(){$('nm').innerHTML=users.map(u=>`<option>${u}</option>`).join('')||'<option value="">(名前を登録)</option>';if(me.name&&users.includes(me.name))$('nm').value=me.name;else if(users.length)me.name=$('nm').value}
$('reg').onclick=()=>{const n=(prompt('社内ユーザー名を登録')||'').trim();if(!n)return;if(!users.includes(n))users.push(n);localStorage.gsUsers=JSON.stringify(users);me.name=n;localStorage.gsName=n;fillNames();$('nm').value=n;place(true)};
$('nm').onchange=()=>{me.name=$('nm').value;localStorage.gsName=me.name;place(true)};
fillNames();
function st(t){$('st').textContent=t||(room?`部屋 ${room}:${isHost?conns.length+1:'参加中'}人`:'未接続(ひとりで使用中)')}

/* ---- ネットワーク(PeerJS: 無料公開サーバ経由のP2P) ---- */
let peer,conns=[],hostC=null,isHost=false,room=null;
function send(m,ex){if(isHost)conns.forEach(c=>c!==ex&&c.open&&c.send(m));else if(hostC&&hostC.open)hostC.send(m)}
function onMsg(m,from){
 if(from&&m.u)from.uid=m.u;
 if(from&&from.col){if(m.c)m.c=from.col;if(m.s)m.s.c=from.col}
 if(m.t=='base'){lastView=null;pdfBytes=null;setBase(m.d,false)}
 else if(m.t=='pdf'){pdfBytes=new Uint8Array(m.d);pdfNo=m.p||1;openPdf()}
 else if(m.t=='view')applyView(m);
 else if(m.t=='ptr')ptrs[m.u]=m;
 else if(m.t=='st')strokes[m.s.id]=m.s;
 else if(m.t=='del')delete strokes[m.id];
 else if(m.t=='las'){let l=lasers.find(a=>a.id==m.id);if(!l)lasers.push(l={id:m.id,c:m.c,pts:[]});l.pts.push([m.x,m.y,performance.now()])}
 else if(m.t=='bye')delete ptrs[m.u];
 else if(m.t=='sync'){if(m.col){me.c=m.col;if(ptrs[me.id]){ptrs[me.id].c=me.c;send(ptrs[me.id])}}
 strokes=m.st||{};ptrs=Object.assign(ptrs,m.pt||{});lastView=m.v||null;pdfBytes=m.pdf?new Uint8Array(m.pdf):null;pdfNo=m.pp||1;if(m.d)setBase(m.d,false,true);else if(lastView)applyView(lastView);if(pdfBytes)openPdf()}
 if(isHost&&from)send(m,from)}
function mkRoom(){if(peer)peer.destroy();conns=[];const code=String(1000+Math.floor(Math.random()*9000));peer=new Peer('genba-'+code);isHost=true;me.c=COL[0];
 peer.on('open',()=>{room=code;history.replaceState(null,'','#'+code);st();place(true)});
 peer.on('error',e=>{if(e.type=='unavailable-id')mkRoom();else st('接続エラー:'+e.type)});
 peer.on('connection',c=>{c.on('open',()=>{const used=[me.c,...conns.map(x=>x.col)];c.col=COL.find(x=>!used.includes(x))||COL[conns.length%COL.length];conns.push(c);c.send({t:'sync',st:strokes,d:baseData,pt:ptrs,v:lastView,pdf:pdfBytes,pp:pdfNo,col:c.col});st()});
  c.on('data',m=>onMsg(m,c));
  c.on('close',()=>{conns=conns.filter(x=>x!=c);if(c.uid){delete ptrs[c.uid];send({t:'bye',u:c.uid})}st()})})}
function joinRoom(code){if(peer)peer.destroy();isHost=false;peer=new Peer();st('接続中…');
 peer.on('open',()=>{hostC=peer.connect('genba-'+code,{reliable:true});
  hostC.on('open',()=>{room=code;st();place(true)});hostC.on('data',m=>onMsg(m));hostC.on('close',()=>{room=null;st('切断されました')})});
 peer.on('error',e=>st(e.type=='peer-unavailable'?'その部屋はありません':'接続エラー:'+e.type))}
function needName(){if(!me.name){$('reg').click()}return !!me.name}
$('mk').onclick=()=>{if(needName())mkRoom()};
$('jn').onclick=()=>{if(!needName())return;const c=(prompt('部屋番号(4桁)')||'').trim();if(c)joinRoom(c)};
$('cp').onclick=async()=>{if(!room)return alert('先に部屋を作成してください');const u=location.href.split('#')[0]+'#'+room;try{await navigator.clipboard.writeText(u);st('リンクをコピーしました')}catch(e){prompt('このリンクを共有',u)}};

/* ---- 図面読込 ---- */
function setBase(d,bc,keep){pdfPage=null;hi=null;const i=new Image();i.onload=()=>{img=i;baseData=d;W=1000;H=1000*i.height/i.width;if(!keep||true){strokes=keep?strokes:{}}fit();if(bc){send({t:'base',d});sendView();if(pdfBytes)send({t:'pdf',d:pdfBytes,p:pdfNo})}else if(lastView)applyView(lastView);place()};i.src=d}
function toBase(src,w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function fromCanvas(c){setBase(c.toDataURL('image/jpeg',.92),true)}
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const n=f.name.toLowerCase();e.target.value='';
 try{
 if(n.endsWith('.pdf')){const bytes=new Uint8Array(await f.arrayBuffer());const pdf=await pdfjsLib.getDocument({data:bytes.slice()}).promise;let p=1;if(pdf.numPages>1)p=Math.min(pdf.numPages,Math.max(1,parseInt(prompt(`ページ番号(1〜${pdf.numPages})`,'1'))||1));
  const pg=await pdf.getPage(p),v0=pg.getViewport({scale:1}),k=Math.min(Math.sqrt(1.4e7/(v0.width*v0.height)),6),v=pg.getViewport({scale:k}),c=toBase(0,v.width,v.height);
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:g,viewport:v}).promise;fromCanvas(c);pdfBytes=bytes;pdfNo=p;openPdf()} else if(n.endsWith('.dxf')){pdfBytes=null;fromCanvas(dxf(await f.text()))}
 else{pdfBytes=null;const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,Math.sqrt(1.6e7/(i.width*i.height))),c=toBase(0,i.width*k,i.height*k),g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(i,0,0,c.width,c.height);fromCanvas(c)};i.src=u}
 }catch(err){alert('読込に失敗しました: '+err.message)}};
function dxf(t){const L=t.split(/\r?\n/),E=[];let e=null;
 for(let i=0;i+1<L.length;i+=2){const g=+L[i].trim(),v=L[i+1].trim();
  if(g==0){if(e)E.push(e);e=['LINE','LWPOLYLINE','CIRCLE','ARC'].includes(v)?{t:v,p:[],r:0,a:0,b:360,f:0}:null;continue}
  if(!e)continue;
  if(g==10||g==11)e.p.push([+v,0]);else if(g==20||g==21)e.p[e.p.length-1][1]=+v;
  else if(g==40)e.r=+v;else if(g==50)e.a=+v;else if(g==51)e.b=+v;else if(g==70)e.f=+v}
 if(e)E.push(e);
 let x0=1e18,y0=1e18,x1=-1e18,y1=-1e18;const bb=(x,y)=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)};
 E.forEach(a=>{a.p.forEach(q=>bb(q[0],q[1]));if(a.r&&a.p[0]){bb(a.p[0][0]-a.r,a.p[0][1]-a.r);bb(a.p[0][0]+a.r,a.p[0][1]+a.r)}});
 if(x0>x1)throw new Error('DXFに図形がありません');
 const k=Math.min(4000/Math.max(x1-x0,1e-9),Math.sqrt(1.6e7/Math.max(1e-9,(x1-x0)*(y1-y0)))),c=toBase(0,(x1-x0)*k+40,(y1-y0)*k+40),g=c.getContext('2d');
 g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.strokeStyle='#111';g.lineWidth=1.3;
 const X=x=>(x-x0)*k+20,Y=y=>(y1-y)*k+20;
 E.forEach(a=>{g.beginPath();
  if(a.t=='CIRCLE'||a.t=='ARC'){const q=a.p[0];if(!q)return;a.t=='CIRCLE'?g.arc(X(q[0]),Y(q[1]),a.r*k,0,7):g.arc(X(q[0]),Y(q[1]),a.r*k,-a.b*Math.PI/180,-a.a*Math.PI/180)}
  else{a.p.forEach((q,j)=>j?g.lineTo(X(q[0]),Y(q[1])):g.moveTo(X(q[0]),Y(q[1])));if(a.f&1)g.closePath()}
  g.stroke()});
 return c}

/* ---- 表示・座標 ---- */
function resize(){const r=cv.getBoundingClientRect();cv.width=r.width*dpr;cv.height=r.height*dpr}
function fit(){const r=cv.getBoundingClientRect();V.s=Math.min(r.width/W,r.height/H)*.98;V.x=(r.width-W*V.s)/2;V.y=(r.height-H*V.s)/2}
let lastView=null,lv=0,vt=0;
function fitS(){const r=cv.getBoundingClientRect();return Math.min(r.width/W,r.height/H)*.98}
function sendView(){const r=cv.getBoundingClientRect();lastView={t:'view',z:V.s/fitS(),x:(r.width/2-V.x)/V.s/W,y:(r.height/2-V.y)/V.s/H};const t=performance.now();if(t-lv>40){lv=t;send(lastView)}clearTimeout(vt);vt=setTimeout(()=>send(lastView),90)}
function applyView(m){const r=cv.getBoundingClientRect();lastView=m;V.s=m.z*fitS();V.x=r.width/2-m.x*W*V.s;V.y=r.height/2-m.y*H*V.s}
async function openPdf(){try{const d=await pdfjsLib.getDocument({data:pdfBytes.slice()}).promise;pdfPage=await d.getPage(pdfNo);hi=null;ht=setTimeout(renderHi,50)}catch(e){}}
async function renderHi(){if(!pdfPage||!img)return;const v0=pdfPage.getViewport({scale:1});
 if(V.s*dpr<=img.width/W*1.05){hi=null;return}
 const k=V.s*dpr*W/v0.width,c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;const g=c.getContext('2d');
 g.fillStyle='#fff';g.fillRect(dpr*V.x,dpr*V.y,W*V.s*dpr,H*V.s*dpr);
 const snap={s:V.s,x:V.x,y:V.y},vp=pdfPage.getViewport({scale:k,offsetX:dpr*V.x,offsetY:dpr*V.y});
 if(rtask)try{rtask.cancel()}catch(e){}
 const t=rtask=pdfPage.render({canvasContext:g,viewport:vp});try{await t.promise}catch(e){return}
 if(t===rtask){hi=c;Vh=snap}}
$('fit').onclick=()=>{fit();sendView()};addEventListener('resize',()=>{resize();fit()});
const toW=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left-V.x)/V.s,(e.clientY-r.top-V.y)/V.s]};
function place(force){if(!me.name)return;if(!ptrs[me.id]||force){const o=Object.keys(ptrs).length*40;ptrs[me.id]={t:'ptr',u:me.id,n:me.name,c:me.c,x:W/2+o,y:H/2+o}}ptrs[me.id].n=me.name;send(ptrs[me.id])}
let lastP=0;function setPtr(w){const p=ptrs[me.id]||(ptrs[me.id]={t:'ptr',u:me.id,c:me.c});p.n=me.name;p.x=w[0];p.y=w[1];const t=performance.now();if(t-lastP>40){lastP=t;send(p)}}

/* ---- 操作 ---- */
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tool=b.dataset.t;document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x==b))});
const P=new Map();let pin=null,pan0=null;
const pinch=()=>{const a=[...P.values()],r=cv.getBoundingClientRect();return{d:Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])||1,cx:(a[0][0]+a[1][0])/2-r.left,cy:(a[0][1]+a[1][1])/2-r.top}};
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);
 if(P.size==2){cur=null;pin=pinch();return}if(P.size>1)return;
 const w=toW(e);
 if(tool=='ptr')setPtr(w);
 else if(tool=='pen'){cur={id:me.id+Date.now(),u:me.id,c:me.c,pts:[w]};strokes[cur.id]=cur}
 else if(tool=='las'){cur={id:me.id+Date.now(),c:me.c,pts:[[w[0],w[1],performance.now()]]};lasers.push(cur);send({t:'las',id:cur.id,c:me.c,x:w[0],y:w[1]})}
 else if(tool=='sel')sel=hit(w);
 else if(tool=='pan')pan0=[e.clientX-V.x,e.clientY-V.y]};
cv.onpointermove=e=>{if(!P.has(e.pointerId))return;P.set(e.pointerId,[e.clientX,e.clientY]);
 if(P.size==2){const n=pinch(),wx=(pin.cx-V.x)/V.s,wy=(pin.cy-V.y)/V.s;V.s=Math.min(40,Math.max(.1,V.s*n.d/pin.d));V.x=n.cx-wx*V.s;V.y=n.cy-wy*V.s;pin=n;sendView();return}
 const w=toW(e);
 if(tool=='ptr')setPtr(w);
 else if(cur&&tool=='pen')cur.pts.push(w);
 else if(cur&&tool=='las'){cur.pts.push([w[0],w[1],performance.now()]);send({t:'las',id:cur.id,c:me.c,x:w[0],y:w[1]})}
 else if(tool=='pan'&&pan0){V.x=e.clientX-pan0[0];V.y=e.clientY-pan0[1];sendView()}};
const up=e=>{P.delete(e.pointerId);pin=null;pan0=null;if(cur&&tool=='pen'){if(cur.pts.length<2)cur.pts.push([cur.pts[0][0]+.1,cur.pts[0][1]]);send({t:'st',s:cur})}cur=null};
cv.onpointerup=up;cv.onpointercancel=up;
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,wx=(px-V.x)/V.s,wy=(py-V.y)/V.s;V.s=Math.min(40,Math.max(.1,V.s*(e.deltaY<0?1.15:.87)));V.x=px-wx*V.s;V.y=py-wy*V.s;sendView()},{passive:false});
function hit(w){const tol=14/V.s;let best=null,bd=tol;for(const id in strokes){const p=strokes[id].pts;for(let i=0;i<p.length-1;i++){const d=segD(w,p[i],p[i+1]);if(d<bd){bd=d;best=id}}}return best}
function segD(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}
$('del').onclick=()=>{if(sel&&strokes[sel]){delete strokes[sel];send({t:'del',id:sel});sel=null}};

/* ---- 描画 ---- */
function arrow(p){const k=1/V.s;cx.save();cx.translate(p.x,p.y);cx.scale(k,k);cx.lineJoin='round';cx.save();cx.scale(.5,.5);
 cx.beginPath();cx.moveTo(2,2);cx.lineTo(36,29);cx.lineTo(14,33);cx.lineTo(10,46);cx.closePath();
 cx.strokeStyle='rgba(255,255,255,.9)';cx.lineWidth=10;cx.stroke();
 cx.fillStyle=cx.strokeStyle=p.c;cx.lineWidth=6;cx.stroke();cx.fill();cx.restore();
 const n=p.n||'';if(n){cx.font='800 15px \'Noto Sans JP\',\'Hiragino Maru Gothic ProN\',\'Hiragino Sans\',sans-serif';const tw=cx.measureText(n).width+14;
 cx.fillStyle=p.c;cx.beginPath();cx.roundRect(12,22,tw,22,6);cx.fill();cx.fillStyle='#fff';cx.fillText(n,19,38)}cx.restore()}
function frame(){const now=performance.now();const key=V.s+','+V.x+','+V.y+','+cv.width;if(key!==vk){vk=key;clearTimeout(ht);ht=setTimeout(renderHi,160)}cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);
 cx.setTransform(dpr*V.s,0,0,dpr*V.s,dpr*V.x,dpr*V.y);cx.imageSmoothingQuality='high';
 if(img)cx.drawImage(img,0,0,W,H);else{cx.fillStyle='#fff';cx.fillRect(0,0,W,H);cx.fillStyle='#888';cx.font='800 28px \'Noto Sans JP\',\'Hiragino Maru Gothic ProN\',\'Hiragino Sans\',sans-serif';cx.textAlign='center';cx.fillText('「図面読込」で画像・PDF・DXFを開いてください',W/2,H/2);cx.textAlign='left'}
 if(hi&&Vh){const r=V.s/Vh.s;cx.save();cx.setTransform(r,0,0,r,dpr*(V.x-Vh.x*r),dpr*(V.y-Vh.y*r));cx.drawImage(hi,0,0);cx.restore()}
 cx.lineCap=cx.lineJoin='round';
 for(const id in strokes){const s=strokes[id];cx.strokeStyle=s.c;cx.lineWidth=3/V.s;cx.beginPath();s.pts.forEach((q,i)=>i?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1]));cx.stroke();
  if(id==sel){cx.strokeStyle='rgba(255,200,0,.6)';cx.lineWidth=12/V.s;cx.stroke()}}
 lasers=lasers.filter(l=>now-l.pts[l.pts.length-1][2]<3000);
 lasers.forEach(l=>{cx.lineWidth=5/V.s;cx.strokeStyle=l.c;cx.lineCap='butt';cx.lineJoin='round';const p=l.pts;let i=1;
  while(i<p.length){const q=Math.round(16*Math.max(0,1-(now-p[i][2])/3000));let j=i;cx.beginPath();cx.moveTo(p[i-1][0],p[i-1][1]);
   while(j<p.length&&Math.round(16*Math.max(0,1-(now-p[j][2])/3000))==q){cx.lineTo(p[j][0],p[j][1]);j++}
   cx.globalAlpha=q/16;cx.stroke();i=j}
  cx.globalAlpha=1;cx.lineCap='round'});
 for(const u in ptrs)if(u!=me.id)arrow(ptrs[u]);if(ptrs[me.id])arrow(ptrs[me.id]);
